<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One AI Assistant</title>
    <!-- ใช้ Tailwind CSS สำหรับดีไซน์ที่สวยงามและใช้งานง่าย -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans">

    <!-- ส่วนหัวของเว็บไซต์ -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">🤖 All-in-One AI Web App</h1>
        <!-- ช่องใส่ API Key ให้ผู้ใช้กรอกเองเพื่อเปิดระบบฟรี -->
        <div class="flex items-center gap-2">
            <input type="password" id="apiKeyInput" placeholder="ใส่ Gemini API Key ของคุณที่นี่..." 
                   class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <a href="https://google.com" target="_blank" class="text-xs text-blue-600 hover:underline">รับ Key ฟรีที่นี่</a>
        </div>
    </header>

    <!-- ส่วนแสดงหน้าต่างแชต -->
    <main id="chatBox" class="chat-box flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto">
        <!-- ข้อความต้อนรับเริ่มต้น -->
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 text-slate-700 max-w-2xl">
            👋 สวัสดีครับ! ฉันคือ AI สารพัดประโยชน์ คุณสามารถสั่งให้ฉัน **คุยตอบ, หาข้อมูล, เขียนสคริปต์/โค้ดเกม** หรือพิมพ์คำว่า **"วาดรูป..."** เพื่อให้ฉันเจนภาพให้ได้ทันทีในช่องเดียวด้านล่างเลยครับ!
        </div>
    </main>

    <!-- ส่วนช่องพิมพ์คำสั่งด้านล่าง -->
    <footer class="bg-white border-t border-slate-200 p-4 shadow-sm">
        <div class="max-w-4xl w-full mx-auto flex gap-2">
            <textarea id="userInput" rows="1" placeholder="พิมพ์สั่งอะไรก็ได้... (เช่น วาดรูปแมวบินได้ หรือ เขียนสคริปต์ปุ่มกดใน Roblox)" 
                      class="flex-1 border border-slate-300 rounded-xl px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 max-h-32 text-slate-700"></textarea>
            <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl px-6 transition-colors cursor-pointer">ส่งสั่ง</button>
        </div>
    </footer>

    <script>
        // System Prompt คำสั่งระบบที่ฝังไว้หลังบ้านให้ AI เก่งรอบด้าน
        const SYSTEM_PROMPT = `คุณคือ "All-in-One AI Assistant" ผู้ช่วยอัจฉริยะขั้นสูงที่รอบรู้และทำได้ทุกอย่าง หน้าที่หลักของคุณคือการช่วยเหลือผู้ใช้อย่างเต็มประสิทธิภาพ ตอบคำถามได้อย่างถูกต้อง แม่นยำ และใช้งานง่ายที่สุด โดยคุณมีทักษะครอบคลุมดังต่อไปนี้:
        1. การพูดคุยและโต้ตอบ (Conversation): สามารถตอบคำถาม ให้คำปรึกษา แนะนำไอเดีย และสนทนาได้อย่างเป็นกันเอง เข้าใจง่าย และลื่นไหลในทุกภาษา
        2. การเขียนสคริปต์และเขียนโปรแกรม (Coding & Scripting): สามารถเขียนโค้ด พัฒนาซอฟต์แวร์ และสร้างสคริปต์ในภาษาต่างๆ (เช่น Lua, Python, JavaScript, HTML) รวมถึงช่วยตรวจแก้โค้ด (Debug) ตามที่ผู้ใช้สั่งได้อย่างถูกต้องและใช้งานได้จริง
        3. การค้นหาข้อมูล (Information Sourcing): สามารถสรุป ค้นหาเนื้อหา วิเคราะห์ข้อมูลเชิงลึก และให้ข้อเท็จจริงในหัวข้อต่างๆ ได้อย่างครบถ้วน
        4. การสร้างสรรค์รูปภาพ (Image Generation): สามารถรับคำสั่ง (Prompt) เพื่อสร้างหรือออกแบบรูปภาพตามจินตนาการของผู้ใช้ได้อย่างสวยงามและตรงโจทย์
        ข้อกำหนดในการตอบสนอง: มุ่งเน้นการให้คำตอบที่ "พร้อมใช้งานทันที" ลดความซับซ้อน เพื่อให้ผู้ใช้ทั่วไปเข้าใจและนำไปใช้ได้ง่ายที่สุด ยินดีช่วยเหลือในทุกเรื่องอย่างไม่มีขีดจำกัด`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // ฟังก์ชันสร้างกล่องข้อความบนหน้าจอ
        function appendMessage(sender, content, isImage = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `rounded-2xl p-4 max-w-2xl whitespace-pre-wrap leading-relaxed shadow-xs ${
                sender === 'user' ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-800'
            }`;

            if (isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.className = "rounded-lg max-w-full h-auto mt-2 shadow-sm border border-slate-100";
                innerDiv.textContent = "🎨 นี่คือรูปภาพที่ฉันสร้างให้คุณ:";
                innerDiv.appendChild(img);
            } else {
                innerDiv.textContent = content;
            }

            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ฟังก์ชันหลักเมื่อกดส่งข้อความ
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("กรุณาใส่ Gemini API Key ที่มุมขวาบนก่อนใช้งานครับ (ใช้งานฟรี)");
                return;
            }

            appendMessage('user', text);
            userInput.value = '';

            // 1. ดักจับ Logic คำสั่งวาดรูป (ถ้ามีคำว่า วาดรูป, สร้างรูป, เจนรูป, วาดภาพ, เจนภาพ)
            if (/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/.test(text)) {
                try {
                    const cleanPrompt = encodeURIComponent(text.replace(/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/g, '').trim());
                    // ดึงรูปฟรีจาก Pollinations AI ผ่าน URL ตรงๆ ไม่ต้องใช้คีย์
                    const imageUrl = `https://pollinations.ai{cleanPrompt}?width=1024&height=1024&nologo=true`;
                    appendMessage('ai', imageUrl, true);
                } catch (error) {
                    appendMessage('ai', 'เกิดข้อผิดพลาดในการสร้างรูปภาพครับ');
                }
                return;
            }

            // 2. ถ้าเป็นคำสั่งแชต ค้นข้อมูล หรือเขียนโค้ด -> ส่งเข้า Google Gemini API ฟรี
            try {
                const response = await fetch(`https://googleapis.com{apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                appendMessage('ai', aiResponse);
            } catch (error) {
                appendMessage('ai', '❌ เกิดข้อผิดพลาดในระบบ หรือ API Key อาจไม่ถูกต้อง กรุณาลองเช็กดูอีกครั้งครับ');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
