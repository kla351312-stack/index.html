<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Mobile Style</title>
    <!-- ใช้ Tailwind CSS สำหรับดีไซน์ที่ถอดแบบจากรูปภาพ -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* ตั้งค่าพื้นหลังไล่เฉดสีฟ้า-ขาวนุ่มๆ ถอดแบบตามรูปภาพเป๊ะๆ */
        body { 
            background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 60%, #cce0ff 100%); 
            color: #1f1f1f; 
        }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 2px; }
        
        /* สไตล์กล่องสคริปต์/โค้ดให้อ่านง่าย */
        pre {
            background-color: #1e1f20;
            border-radius: 12px;
            padding: 14px;
            font-family: monospace;
            color: #a8ffb2;
            overflow-x: auto;
            margin-top: 6px;
            font-size: 0.9rem;
        }

        /* เอฟเฟกต์สีประกายดาว Gemini */
        .gemini-sparkle {
            background: linear-gradient(135deg, #4285f4, #9b51e0, #ea4335, #fbbc05);
            display: inline-block;
            width: 50px;
            height: 50px;
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <!-- ส่วนหัว: ซ่อนช่องใส่คีย์ให้เป็นปุ่มเล็กๆ เรียบหรู ไม่กวนสายตา -->
    <header class="px-6 py-3 flex justify-between items-center z-10">
        <div class="text-sm font-semibold text-slate-500 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ready
        </div>
        <div class="flex items-center gap-1 bg-white/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-200/80 shadow-xs">
            <span class="text-[11px] text-slate-500 whitespace-nowrap font-medium">🔑 คีย์ของคุณ:</span>
            <input type="password" id="apiKeyInput" placeholder="วางคีย์ AQ... ที่นี่" 
                   class="bg-transparent border-none outline-none text-xs text-slate-800 placeholder-slate-400 w-36">
        </div>
    </header>

    <!-- ส่วนพื้นที่หน้าจอ: โชว์แต่โลโก้ดาวดวงกลางตามรูปภาพ ไม่เอาตัวอักษรใดๆ -->
    <main id="chatBox" class="chat-box flex-1 overflow-y-auto px-6 pb-24 space-y-6 max-w-xl w-full mx-auto flex flex-col justify-center">
        <!-- โลโก้ดาวประกายแสงตรงกลางในรูปภาพ -->
        <div class="text-center my-auto transition-all duration-500" id="centerLogo">
            <div class="gemini-sparkle shadow-lg animate-bounce duration-1000"></div>
        </div>
    </main>

    <!-- ส่วนกล่องพิมพ์คำสั่งด้านล่าง: ถอดแบบแคปซูลมนสีขาวลอยได้จากภาพถ่ายหน้าจอของคุณ -->
    <footer class="fixed bottom-0 left-0 right-0 p-4 max-w-xl w-full mx-auto z-10">
        <div class="bg-white border border-slate-200/80 rounded-full py-2 px-4 flex items-center gap-3 shadow-[0_8px_30px_rgb(0,0,0,0.06)] backdrop-blur-xs">
            
            <!-- ปุ่มเครื่องหมายบวกด้านซ้ายในรูป -->
            <button class="text-slate-400 hover:text-slate-600 p-1 flex items-center justify-center cursor-pointer">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>

            <!-- ช่องพิมพ์ข้อความคำสั่ง -->
            <textarea id="userInput" rows="1" placeholder="ถาม Gemini..." 
                      class="flex-1 bg-transparent border-none outline-none resize-none py-2 text-base text-slate-800 placeholder-slate-400 max-h-24 min-h-[40px] leading-relaxed"></textarea>
            
            <!-- ปุ่มไอคอนไมโครโฟน -->
            <button class="text-slate-500 hover:text-slate-700 p-1 flex items-center justify-center cursor-pointer">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3z" />
                </svg>
            </button>

            <!-- ปุ่มกดส่งข้อความ (ไอคอนคลื่นเสียงด้านขวาสุดของรูปภาพ) -->
            <button id="sendBtn" class="bg-blue-50 hover:bg-blue-100 text-blue-600 p-2.5 rounded-full transition-colors cursor-pointer flex items-center justify-center">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3z" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = `คุณคือ "All-in-One AI Assistant" ผู้ช่วยอัจฉริยะขั้นสูงที่รอบรู้และทำได้ทุกอย่าง หน้าที่หลักของคุณคือการช่วยเหลือผู้ใช้อย่างเต็มประสิทธิภาพ ตอบคำถามได้อย่างถูกต้อง แม่นยำ และใช้งานง่ายที่สุด โดยคุณมีทักษะครอบคลุมดังต่อไปนี้:
        1. การพูดคุยและโต้ตอบ (Conversation): สามารถตอบคำถาม ให้คำปรึกษา แนะนำไอเดีย และสนทนาได้อย่างเป็นกันเอง เข้าใจง่าย และลื่นไหลในทุกภาษา
        2. การเขียนสคริปต์และเขียนโปรแกรม (Coding & Scripting): สามารถเขียนโค้ด พัฒนาซอฟต์แวร์ และสร้างสคริปต์ในภาษาต่างๆ (เช่น Lua, Python, JavaScript, HTML) รวมถึงช่วยตรวจแก้โค้ด (Debug) ตามที่ผู้ใช้สั่งได้อย่างถูกต้องและใช้งานได้จริง
        3. การค้นหาข้อมูล (Information Sourcing): สามารถสรุป ค้นหาเนื้อหา วิเคราะห์ข้อมูลเชิงลึก และให้ข้อเท็จจริงในหัวข้อต่างๆ ได้อย่างครบถ้วน
        4. การสร้างสรรค์รูปภาพ (Image Generation): สามารถรับคำสั่ง (Prompt) เพื่อสร้างหรือออกแบบรูปภาพตามจินตนาการของผู้ใช้ได้อย่างสวยงามและตรงโจทย์
        ข้อกำหนดในการตอบสนอง: มุ่งเน้นการให้คำตอบที่ "พร้อมใช้งานทันที" ลดความซับซ้อน เพื่อให้ผู้ใช้ทั่วไปเข้าใจและนำไปใช้ได้ง่ายที่สุด ยินดีช่วยเหลือในทุกเรื่องอย่างไม่มีขีดจำกัด`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const centerLogo = document.getElementById('centerLogo');

        function formatAIResponse(text) {
            return text.replace(/```([\s\S]*?)```/g, function(match, code) {
                return `<pre><code>${code.trim()}</code></pre>`;
            });
        }

        function appendMessage(sender, content, isImage = false) {
            // ซ่อนดาวดวงใหญ่ตรงกลาง และเปลี่ยนทิศทาง Flex เพื่อให้แชตไหลจากบนลงล่าง
            if (centerLogo) {
                centerLogo.remove();
                chatBox.classList.remove('justify-center');
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `rounded-2xl p-4 max-w-[85%] text-base leading-relaxed ${
                sender === 'user' ? 'bg-slate-800 text-white shadow-xs' : 'bg-white/80 border border-slate-200 text-slate-800 shadow-xs'
            }`;

            if (isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.className = "rounded-xl max-w-full h-auto mt-2 shadow-xs border border-slate-100";
                innerDiv.innerHTML = `<span class="text-blue-600 font-semibold text-sm">✨ สร้างภาพสำเร็จ:</span>`;
                innerDiv.appendChild(img);
            } else {
                if (sender === 'ai') {
                    innerDiv.innerHTML = `<div class="text-blue-600 font-semibold text-xs mb-1">✨ Gemini Response:</div><div class="whitespace-pre-wrap">${formatAIResponse(content)}</div>`;
                } else {
                    innerDiv.textContent = content;
                }
            }

            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("กรุณากรอก Gemini API Key (คีย์ประเภท AQ...) ที่แถบด้านบนก่อนเริ่มพิมพ์สั่งงานครับ");
                return;
            }

            appendMessage('user', text);
            userInput.value = '';

            // 1. ดักจับ Logic คำสั่งสร้างรูปภาพฟรี
            if (/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/.test(text)) {
                try {
                    const cleanPrompt = encodeURIComponent(text.replace(/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/g, '').trim());
                    const imageUrl = `https://pollinations.ai{cleanPrompt}?width=1024&height=1024&nologo=true`;
                    appendMessage('ai', imageUrl, true);
                } catch (error) {
                    appendMessage('ai', 'เกิดข้อผิดพลาดในการสร้างรูปภาพครับ');
                }
                return;
            }

            // 2. ส่งคำสั่งทั่วไป/ค้นหา/เขียนสคริปต์ ไปหลังบ้านด้วย Bearer Token เพื่อรองรับคีย์ความปลอดภัยรูปแบบ AQ. ของคุณ
            try {
                const response = await fetch(`https://googleapis.com`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
'Authorization': Bearer ${apiKey}
},
body: JSON.stringify({
contents: [{ parts: [{ text: text }] }],
systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
})
});
const data = await response.json();
if (data.error) throw new Error(data.error.message);
const aiResponse = data.candidates.content.parts.text;
appendMessage('ai', aiResponse);
} catch (error) {
appendMessage('ai', '❌ คีย์ไม่ถูกต้อง คัดลอกมาไม่ครบ หรือเกิดปัญหาในการเชื่อมต่อระบบ กรุณาลองเช็กคีย์ AQ. ของคุณใหม่อีกครั้งครับ');
}
}
sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
handleSend();
}
});
