<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash-Lite Extension - KLA AI Hub</title>
    <!-- โหลด Tailwind CSS v3 และฟอนต์ Anuphan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #ffffff; color: #1f2937; }
        /* ไล่เฉดสีขาวด้านบนลงมาเป็นฟ้าจางๆ ด้านล่างเหมือนภาพเป๊ะๆ */
        .gemini-bg { background: linear-gradient(180deg, #ffffff 45%, #e0f2fe 100%); }
    </style>
</head>
<body class="gemini-bg min-h-screen flex flex-col justify-between antialiased overflow-x-hidden relative select-none">

    <!-- ☰ SIDEBAR CONTROL MENU (แผงควบคุมระบบซ่อนไว้ด้านข้าง เปิดเมื่อกดเมนูแฮมเบอร์เกอร์) -->
    <aside id="controlSidebar" class="fixed inset-y-0 left-0 w-72 bg-gray-900 text-gray-100 transform -translate-x-full transition-transform duration-300 ease-in-out z-50 p-5 flex flex-col justify-between shadow-2xl">
        <div>
            <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-5">
                <h2 class="text-sm font-bold text-lime-400"><i class="fas fa-cogs"></i> แผงควบคุมระบบ KLA AI</h2>
                <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-lg"><i class="fas fa-times"></i></button>
            </div>

            <!-- ส่วนการเลือกโมเดล AI -->
            <div class="mb-5">
                <label class="text-xs text-gray-400 font-bold block mb-2"><i class="fas fa-brain"></i> เลือกโมเดล AI:</label>
                <select id="aiModelSelector" onchange="updateSystemStatus()" class="w-full bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-lime-400 font-bold focus:outline-none">
                    <option value="gpt4o">🧠 GPT-4o Uncensored</option>
                    <option value="claude35">⚡ Claude 3.5 Sonnet</option>
                    <option value="deepseek">🕵️ DeepSeek-V3 Pro</option>
                    <option value="gemini">🌐 Gemini 1.5 Pro</option>
                    <option value="klaCustom">🔥 KLA Custom Core</option>
                </select>
            </div>

            <!-- ส่วนเลือกโหมดบอต -->
            <div class="mb-5 space-y-2">
                <label class="text-xs text-gray-400 font-bold block"><i class="fas fa-theater-masks"></i> โหมดการทำหน้าที่บอต:</label>
                <select id="chatMode" class="w-full bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-amber-400 font-bold focus:outline-none">
                    <option value="toxic">🖕 โหมดกวนตีน/คำหยาบทุกภาค</option>
                    <option value="nsfw">🔞 โหมดลามก 18+ (Uncensored)</option>
                    <option value="polite">😇 โหมดสุภาพช่วยเหลือการงาน</option>
                </select>
            </div>

            <!-- ฟังก์ชันพิเศษ -->
            <div class="space-y-2">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">ฟังก์ชันพิเศษ</p>
                <button onclick="triggerTool('สร้างสคริปต์เกม Roblox/Unity')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-gamepad text-indigo-400"></i> 🎮 สคริปต์เกมอัตโนมัติ
                </button>
                <button onclick="triggerTool('โมเดลโปร/สูตรโกงMod')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-bolt text-red-400"></i> ⚡ เจนโปร/สูตรโกงเกม
                </button>
                <button onclick="triggerTool('สร้างเว็บ HTML5/React')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-code text-teal-400"></i> 🌐 สร้างหน้าเว็บอัตโนมัติ
                </button>
            </div>
        </div>

        <div class="text-[10px] text-gray-600 text-center border-t border-gray-800 pt-3 flex justify-between">
            <span>● Database Sync</span>
            <span class="text-lime-500" id="sidebarStatus">GPT-4o Ready</span>
        </div>
    </aside>

    <!-- ฉากหลังโปร่งแสงเมื่อเปิดเมนูควบคุม -->
    <div id="menuBackdrop" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 hidden z-45"></div>


    <!-- 1. HEADER TOP BAR (แถบเมนูด้านบนเหมือนต้นฉบับ 100%) -->
    <header class="w-full px-4 py-3 flex items-center justify-between z-10">
        <!-- ปุ่มแฮมเบอร์เกอร์ ☰ -->
        <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center text-gray-700 hover:bg-gray-100 rounded-full transition text-xl">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- หัวข้อ Flash-Lite Extension พร้อมลูกศรชี้ลง -->
        <div onclick="toggleMenu()" class="flex items-center gap-1.5 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-full transition">
            <span class="text-sm md:text-base font-normal text-gray-800 tracking-tight">Flash-Lite Exten...</span>
            <i class="fas fa-chevron-down text-[10px] text-gray-500 mt-0.5"></i>
        </div>

        <!-- ฝั่งขวา ไอคอนประกาย/พู่กัน และรูปโปรไฟล์ -->
        <div class="flex items-center gap-2.5">
            <button onclick="resetDisplayChat()" class="w-9 h-9 flex items-center justify-center text-gray-700 hover:bg-gray-100 rounded-full transition text-base border border-dashed border-gray-400/50" title="เปิดหน้าใหม่">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
            </button>
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white overflow-hidden shadow-sm cursor-pointer" onclick="toggleMenu()">
                <i class="fas fa-user text-xs"></i>
            </div>
        </div>
    </header>


    <!-- 2. CORE DISPLAY AREA (ส่วนกลางหน้าจอ ตรงกับรูป 100%) -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-12" id="mainDisplayView">
        
        <!-- หน้าจอทักทายตอนเริ่ม -->
        <div id="welcomeScreen" class="flex flex-col items-center text-center space-y-6">
            <!-- โลโก้ดาวประกายรุ้ง SVG เกรเดียนต์แท้ -->
            <div class="w-12 h-12 flex items-center justify-center animate-pulse drop-shadow-sm">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10">
                    <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gemini_grad)"/>
                    <defs>
                        <linearGradient id="gemini_grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4285F4"/>
                            <stop offset="0.33" stop-color="#34A853"/>
                            <stop offset="0.66" stop-color="#FBBC05"/>
                            <stop offset="1" stop-color="#EA4335"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <!-- ข้อความทักทายเป๊ะตามภาพ -->
            <h2 class="text-2xl md:text-3xl font-medium tracking-wide text-gray-800">ถามได้เลย คุณ กล้า</h2>
        </div>

        <!-- หน้าจอแสดงผลแชท (จะแสดงขึ้นมาเมื่อมีการส่งข้อความ) -->
        <div id="activeChatLog" class="hidden w-full max-w-xl flex-col space-y-4 max-h-[50vh] overflow-y-auto p-2 text-sm"></div>
    </main>


    <!-- 3. FOOTER INPUT ROW (กล่องแคปซูลอินพุตด้านล่างตรงตามภาพ 100%) -->
    <footer class="w-full p-4 max-w-xl mx-auto pb-8 z-10">
        <!-- กล่องแคปซูลอินพุตสีขาวมนทรง Capsule -->
        <div class="w-full bg-white rounded-full border border-gray-200/90 py-2 px-3 flex items-center justify-between shadow-md">
            <!-- ปุ่มเพิ่มไฟล์บวกด้านซ้าย -->
            <label class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition cursor-pointer shrink-0">
                <i class="fas fa-plus text-base font-light"></i>
                <input type="file" class="hidden" onchange="handleFileUpload(this)">
            </label>

            <!-- ช่องอินพุตป้อนข้อความ -->
            <input type="text" id="chatInputField" placeholder="ถาม Ge..." class="flex-1 px-3 text-sm md:text-base text-gray-800 focus:outline-none bg-transparent placeholder-gray-400 font-normal" onkeypress="if(event.key === 'Enter') handleInputSubmit()">

            <!-- กลุ่มไอคอนไมค์และปุ่มคลื่นเสียงฝั่งขวา -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="triggerVoiceCall()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition text-base" title="ข้อความเสียง">
                    <i class="fas fa-microphone"></i>
                </button>
                <button onclick="handleInputSubmit()" class="w-10 h-10 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center hover:bg-sky-200 transition text-sm shadow-sm" title="ส่งข้อมูล">
                    <i class="fas fa-wave-square text-xs"></i>
                </button>
            </div>
        </div>
    </footer>


    <!-- ระบบการทำงาน JavaScript Engine -->
    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('controlSidebar');
            const backdrop = document.getElementById('menuBackdrop');

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.remove('translate-x-0');
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function updateSystemStatus() {
            const selector = document.getElementById('aiModelSelector');
            const modelName = selector.options[selector.selectedIndex].text.split(' ')[1];
            document.getElementById('sidebarStatus').innerText = `${modelName} Ready`;
        }

        function resetDisplayChat() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('activeChatLog').classList.add('hidden');
            document.getElementById('activeChatLog').innerHTML = '';
        }

        function handleInputSubmit() {
            const input = document.getElementById('chatInputField');
            if (!input.value.trim()) return;

            const welcomeScreen = document.getElementById('welcomeScreen');
            const chatLog = document.getElementById('activeChatLog');

            welcomeScreen.classList.add('hidden');
            chatLog.classList.remove('hidden');

            chatLog.innerHTML += `<div class="flex flex-col items-end w-full"><div class="bg-gray-100 border border-gray-200/60 p-3 rounded-2xl rounded-tr-none text-gray-800 max-w-[85%] font-normal">${input.value}</div></div>`;

            const currentInputValue = input.value;
            setTimeout(() => {
                chatLog.innerHTML += `<div class="flex gap-3 w-full"><div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">AI</div><div class="bg-blue-50/70 border border-blue-100 p-3 rounded-2xl rounded-tl-none text-gray-800 max-w-[85%] leading-relaxed">ได้รับข้อความ "${currentInputValue}" เรียบร้อยครับคุณกล้า! หน้าจอคลีนสวยงามเหมือนภาพตัวอย่าง 100% แล้วครับ!</div></div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 350);

            input.value = '';
            setTimeout(() => { chatLog.scrollTop = chatLog.scrollHeight; }, 30);
        }

        function handleFileUpload(el) {
            if (el.files.length > 0) alert(`📁 อัปโหลดไฟล์ "${el.files[0].name}" เรียบร้อย!`);
        }

        function triggerVoiceCall() { 
            alert("📞 กำลังเริ่มระบบข้อความเสียง..."); 
        }

        function triggerTool(name) { 
            alert(`⚙️ รันคำสั่งพิเศษ: "${name}" สำเร็จ!`); 
            toggleMenu(); 
        }
    </script>
</body>
</html>
