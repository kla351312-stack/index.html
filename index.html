<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLA - แพลตฟอร์ม AI อัจฉริยะ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; }
        
        /* แถบเมนูด้านซ้าย */
        .sidebar { width: 260px; background-color: #0f0f10; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #282829; }
        .logo-container { display: flex; align-items: center; gap: 12px; padding: 5px; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff4a7d; }
        .brand-name { font-size: 20px; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .new-chat-btn { background-color: #1a1a1c; border: 1px solid #424244; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.3s; }
        .new-chat-btn:hover { background-color: #2b2b2e; }

        /* พื้นที่แชทหลัก */
        .chat-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .chat-header { padding: 20px; border-bottom: 1px solid #282829; text-align: center; font-size: 18px; color: #aaa; }
        
        /* ส่วนแสดงกล่องข้อความ */
        .messages-container { flex: 1; overflow-y: auto; padding: 40px 20% 100px 20%; display: flex; flex-direction: column; gap: 24px; }
        .welcome-screen { text-align: center; margin-top: 10vh; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .welcome-logo { width: 100px; height: 100px; border-radius: 50%; box-shadow: 0 0 20px rgba(255, 74, 125, 0.4); }
        
        .message { display: flex; gap: 16px; padding: 15px; border-radius: 8px; line-height: 1.6; max-width: 85%; }
        .message.user { background-color: #2b2b2e; align-self: flex-end; color: #fff; }
        .message.ai { background-color: transparent; align-self: flex-start; }

        /* ช่องกรอกข้อความด้านล่าง */
        .input-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 20%; background: linear-gradient(transparent, #131314 30%); }
        .input-box-wrapper { display: flex; background-color: #1e1e20; border-radius: 28px; padding: 6px 16px; align-items: center; border: 1px solid #303030; }
        .input-box-wrapper:focus-within { border-color: #ff4a7d; }
        .chat-input { flex: 1; background: none; border: none; color: #fff; padding: 12px; font-size: 16px; outline: none; }
        .send-btn { background-color: #ff4a7d; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.3s; }
        .send-btn:hover { background-color: #e03e6c; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- แถบด้านซ้าย -->
    <div class="sidebar">
        <div class="logo-container">
            <img src="https://imgbox.com" class="logo-img" alt="KLA Logo">
            <span class="brand-name">KLA AI</span>
        </div>
        <button class="new-chat-btn" onclick="resetChat()">+ แชทใหม่</button>
    </div>

    <!-- ส่วนของแชท -->
    <div class="chat-area">
        <div class="chat-header">โมเดลพัฒนาพิเศษ: KLA-Flash-v1</div>
        
        <div class="messages-container" id="chatMessages">
            <!-- หน้าจอเริ่มต้น -->
            <div class="welcome-screen" id="welcomeScreen">
                <img src="https://imgbox.com" class="welcome-logo" alt="KLA Logo">
                <h2>มีอะไรให้ KLA ช่วยเหลือคุณในวันนี้ไหมครับ?</h2>
            </div>
        </div>

        <!-- กล่องพิมพ์ข้อความ -->
        <div class="input-container">
            <div class="input-box-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="ถาม KLA ได้ทุกเรื่อง..." onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function checkEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // ซ่อนหน้าจอเปลี่ยนเมื่อเริ่มคุย
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // 1. เพิ่มข้อความฝั่งผู้ใช้
            appendMessage(text, 'user');
            userInput.value = '';

            // 2. สร้างข้อความจำลองจากฝั่ง AI KLA ตอบกลับ (ตรงนี้สามารถนำไปเชื่อมต่อ API เพิ่มเติมได้)
            setTimeout(() => {
                const aiReply = `สวัสดีครับ ผมคือระบบ AI อัจฉริยะนามว่า **KLA** ยินดีที่ได้ให้บริการครับ คุณเพิ่งถามผมว่า: "${text}" มีอะไรให้ผมช่วยเจาะลึกต่อไหมครับ?`;
                appendMessage(aiReply, 'ai');
            }, 800);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>\$1</strong>'); // แปลงตัวหนาแบบง่าย
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // เลื่อนหน้าจอลงล่างสุดอัตโนมัติ
        }

        function resetChat() {
            chatMessages.innerHTML = '';
            chatMessages.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
