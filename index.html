<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLA AI Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .logo-area {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
        }
        .menu-list {
            list-style: none;
            padding: 15px 10px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .menu-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #8b949e;
            transition: background 0.2s, color 0.2s;
        }
        .menu-item:hover, .menu-item.active {
            background-color: #21262d;
            color: #f0f6fc;
        }
        
        /* Main Content / Chat Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d1117;
            height: 100%;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            font-size: 16px;
            font-weight: 600;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.ai {
            background-color: #21262d;
            align-self: flex-start;
            color: #c9d1d9;
        }
        .message.user {
            background-color: #1f6feb;
            align-self: flex-end;
            color: #ffffff;
        }
        .chat-input-area {
            padding: 15px 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 15px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #58a6ff;
        }
        .send-btn {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background-color: #2ea043;
        }

        /* Responsive Design สำหรับมือถือ */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 140px;
                border-right: none;
                border-bottom: 1px solid #30363d;
            }
            .logo-area {
                padding: 10px 15px;
                font-size: 16px;
            }
            .menu-list {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 5px;
                padding: 10px;
            }
            .menu-item {
                white-space: nowrap;
                flex-shrink: 0;
                margin-bottom: 0;
                padding: 8px 12px;
            }
            .main-content {
                height: calc(100vh - 140px);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-area">🤖 KLA AI Hub</div>
        <ul class="menu-list">
            <li class="menu-item active">💬 AI Chat Assistant</li>
            <li class="menu-item">🎭 KLA Roleplay Studio</li>
            <li class="menu-item">🖼️ Watermark Remover</li>
            <li class="menu-item">🎬 KLA Video Studio</li>
            <li class="menu-item">🎵 KLA Music Studio</li>
            <li class="menu-item">💻 Dev & Mod Hub</li>
            <li class="menu-item">🎨 Uncensored Art Studio</li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="chat-header">AI Chat Assistant</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">สวัสดีครับ! ผม KLA AI พร้อมช่วยเหลือคุณแล้ว พิมพ์ข้อความคุยกันได้เลยครับ</div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="userInput" placeholder="พิมพ์ข้อความที่นี่...">
            <button class="send-btn" id="sendBtn">ส่ง</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // แสดงข้อความผู้ใช้
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);

            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // จำลองการตอบกลับของ AI
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = "ได้รับข้อความ \"" + text + "\" แล้วครับ ระบบทำงานปกติบนมือถือแล้วครับ!";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 600);
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
