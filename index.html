        function changeMemeProfile() {
            const randIndex = Math.floor(Math.random() * memeProfiles.length);

            chatBox.innerHTML += `

                    ✨ [ระบบอัตโนมัติ] KLA เปลี่ยนรูปโปรไฟล์เป็นมีมตลกออนไลน์ใบใหม่แล้ว!
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function onSystemUpdate() {
            changeMemeProfile();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const role = document.getElementById('roleInput').value;
            const mode = document.getElementById('chatMode').value;
            let dialect = document.getElementById('dialectMode').value;

            if (!input.value.trim()) return;

            const chatBox = document.getElementById('chatBox');
            
            chatBox.innerHTML += `
                <div class="flex gap-2 max-w-xl ml-auto justify-end">
                    <div class="bg-lime-950 p-2.5 rounded-lg rounded-tl-none border border-lime-800 text-right">
                        ${input.value}
                    </div>
                </div>
            `;

            if (mode === 'polite') dialect = 'central';
            
            const modeResponses = responses[mode][dialect];
            let botReply = modeResponses[Math.floor(Math.random() * modeResponses.length)];

            if (role) {
                botReply = `[สวมบทบาทเป็น ${role}]: ` + botReply;
            }

            setTimeout(() => {
                chatBox.innerHTML += `
                    <div class="flex gap-2 max-w-xl">
                        <div class="w-7 h-7 bg-lime-400 rounded-full flex items-center justify-center text-gray-950 text-xs font-bold">KLA</div>
                        <div class="bg-gray-800 p-2.5 rounded-lg rounded-tl-none">
                            ${botReply}
                        </div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
                if (Math.random() > 0.6) changeMemeProfile();
            }, 500);

            input.value = '';
        }
