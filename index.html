<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Custom AI Assistant</title>
    <!-- ใช้ Tailwind CSS สำหรับดีไซน์ที่สวยงามและใช้งานง่าย -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #131314; color: #e3e3e3; }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: #3e3f40; border-radius: 3px; }
        /* สไตล์ไอคอนไล่เฉดสีแบบ Gemini */
        .gemini-gradient {
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <!-- ส่วนหัวของเว็บไซต์ (สไตล์มินิมอล) -->
    <header class="px-6 py-4 flex justify-between items-center border-b border-[#202124]">
        <h1 class="text-xl font-medium tracking-wide flex items-center gap-2">
            <span class="text-2xl">✨</span> <span class="gemini-gradient font-bold">Gemini All-in-One</span>
        </h1>
        <span class="text-xs text-slate-500 bg-[#1e1f20] px-3 py-1 rounded-full border border-[#3c4043]">Free System</span>
    </header>

    <!-- ส่วนแสดงหน้าต่างแชต -->
    <main id="chatBox" class="chat-box flex-1 overflow-y-auto p-6 space-y-6 max-w-3xl w-full mx-auto flex flex-col">
        <!-- ข้อความต้อนรับเริ่มต้นสไตล์ Gemini -->
        <div class="my-auto text-center space-y-4 max-w-xl mx-auto py-12" id="welcomeMessage">
            <h2 class="text-4xl font-semibold leading-tight">
                <span class="gemini-gradient">สวัสดีครับ</span><br>
                <span class="text-slate-400 text-3xl">ฉันสามารถช่วยอะไรคุณได้บ้างในวันนี้?</span>
            </h2>
            <p class="text-sm text-slate-400 pt-2">
                คุณสามารถสั่งให้ฉันโต้ตอบ ค้นหาข้อมูล เขียนสคริปต์/โค้ดโปรแกรม หรือพิมพ์คำว่า <span class="text-blue-400">"วาดรูป..."</span> เพื่อเจนภาพฟรีได้ทันที
            </p>
        </div>
    </main>

    <!-- ส่วนช่องพิมพ์คำสั่งด้านล่าง ลอยขึ้นมาสไตล์ Gemini -->
    <footer class="p-4 max-w-3xl w-full mx-auto mb-4">
        <div class="bg-[#1e1f20] border border-[#3c4043] rounded-3xl p-2 flex items-center gap-2 shadow-xl focus-within:border-[#8e918f] transition-all">
            <textarea id="userInput" rows="1" placeholder="พิมพ์สั่งงานหรือถามคำถามที่นี่..." 
                      class="flex-1 bg-transparent border-none outline-none resize-none px-4 py-2 text-base text-[#e3e3e3] placeholder-[#8e918f] max-h-32 min-h-[40px] leading-relaxed"></textarea>
            <button id="sendBtn" class="bg-[#2f3032] hover:bg-[#3e3f40] text-white p-3 rounded-full transition-colors cursor-pointer flex items-center justify-center">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-blue-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L6 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = `คุณคือ "All-in-One AI Assistant" ผู้ช่วยอัจฉริยะขั้นสูงที่รอบรู้และทำได้ทุกอย่าง หน้าที่หลักของคุณคือการช่วยเหลือผู้ใช้อย่างเต็มประสิทธิภาพ ตอบคำถามได้อย่างถูกต้อง แม่นยำ และใช้งานง่ายที่สุด โดยคุณมีทักษะครอบคลุมดังต่อไปนี้:
        1. การพูดคุยและโต้ตอบ (Conversation): สามารถตอบคำถาม ให้คำปรึกษา แนะนำไอเดีย และสนทนาได้อย่างเป็นกันเอง เข้าใจง่าย และลื่นไหลในทุกภาษา
        2. การเขียนสคริปต์และเขียนโปรแกรม (Coding & Scripting): สามารถเขียนโค้ด พัฒนาซอฟต์แวร์ และสร้างสคริปต์ในภาษาต่างๆ (เช่น Lua, Python, JavaScript, HTML) รวมถึงช่วยตรวจแก้โค้ด (Debug) ตามที่ผู้ใช้สั่งได้อย่างถูกต้องและใช้งานได้จริง
        3. การค้นหาข้อมูล (Information Sourcing): สามารถสรุป ค้นหาเนื้อหา วิเคราะห์ข้อมูลเชิงลึก และให้ข้อเท็จจริงในหัวข้อต่างๆ ได้อย่างครบถ้วน
        4. การสร้างสรรค์รูปภาพ (Image Generation): สามารถรับคำสั่ง (Prompt) เพื่อสร้างหรือออกแบบรูปภาพตามจินตนาการของผู้ใช้ได้อย่างสวยงามและตรงโจทย์
        ข้อกำหนดในการตอบสนอง: มุ่งเน้นการให้คำตอบที่ "พร้อมใช้งานทันที" ลดความซับซ้อน เพื่อให้ผู้ใช้ทั่วไปเข้าใจและนำไปใช้ได้ง่ายที่สุด ยินดีช่วยเหลือในทุกเรื่องอย่างไม่มีขีดจำกัด`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeMessage = document.getElementById('welcomeMessage');

        function appendMessage(sender, content, isImage = false) {
            if (welcomeMessage) welcomeMessage.remove(); // ซ่อนข้อความต้อนรับเมื่อเริ่มแชต

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `rounded-2xl p-4 max-w-xl text-base leading-relaxed ${
                sender === 'user' ? 'bg-[#2b2a33] text-[#e3e3e3]' : 'bg-transparent text-[#e3e3e3]'
            }`;

            if (isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.className = "rounded-xl max-w-full h-auto mt-2 shadow-md border border-[#3c4043]";
                innerDiv.innerHTML = `<span class="gemini-gradient font-semibold">🎨 นี่คือรูปภาพที่ฉันสร้างให้คุณ:</span>`;
                innerDiv.appendChild(img);
            } else {
                if (sender === 'ai') {
                    innerDiv.innerHTML = `<div class="gemini-gradient font-semibold mb-1">✨ Response:</div><div class="whitespace-pre-wrap">${content}</div>`;
                } else {
                    innerDiv.textContent = content;
                }
            }

            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // 1. ดักจับ Logic คำสั่งวาดรูปฟรี
            if (/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/.test(text)) {
                try {
                    const cleanPrompt = encodeURIComponent(text.replace(/วาดรูป|สร้างรูป|เจนรูป|วาดภาพ|เจนภาพ/g, '').trim());
                    const imageUrl = `https://pollinations.ai{cleanPrompt}?width=1024&height=1024&nologo=true`;
                    appendMessage('ai', imageUrl, true);
                } catch (error) {
                    appendMessage('ai', 'เกิดข้อผิดพลาดในการสร้างรูปภาพครับ');
                }
                return;
            }

            // 2. ส่งเข้าหลังบ้านเพื่อเรียกใช้ API Key ที่เราจะฝังไว้ใน Vercel
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, systemPrompt: SYSTEM_PROMPT })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);
                appendMessage('ai', data.text);
            } catch (error) {
                appendMessage('ai', '❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบหลังบ้าน กรุณาตรวจสอบการตั้งค่า API Key บน Vercel ครับ');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
