<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash-Lite Extension - KLA AI Hub</title>
    <!-- ใช้ระบบ Tailwind CSS v3 และชุดไอคอนสวยเสถียรสำหรับ GitHub Pages -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #ffffff; color: #1f2937; }
        /* ไล่เฉดสีขาว-ฟ้าจางๆ ด้านล่างตามภาพที่คุณส่งมา */
        .gemini-bg { background: linear-gradient(180deg, #ffffff 60%, #e0f2fe 100%); }
        /* สไตล์ไอคอนดาวประกายรุ้งแบบมีมิติ */
        .sparkle-gradient {
            background: radial-gradient(circle at center, #60a5fa, #f43f5e, #fbbf24);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
        }
    </style>
</head>
<body class="gemini-bg min-h-screen flex flex-col justify-between antialiased overflow-x-hidden relative">

    <!-- ☰ SIDEBAR CONTROL MENU (เมนูควบคุมระบบทั้งหมด เมนูโมเดล และ 18+ ซ่อนไว้ตรงนี้อย่างปลอดภัยไม่ให้พัง) -->
    <aside id="controlSidebar" class="fixed inset-y-0 left-0 w-72 bg-gray-900 text-gray-100 transform -translate-x-full transition-transform duration-300 ease-in-out z-50 p-5 flex flex-col justify-between shadow-2xl">
        <div>
            <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-5">
                <h2 class="text-sm font-bold text-lime-400"><i class="fas fa-cogs"></i> แผงควบคุมระบบ KLA AI</h2>
                <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-lg"><i class="fas fa-times"></i></button>
            </div>

            <!-- ส่วนการเลือกสมองหลังบ้าน (AI Model Selector) -->
            <div class="mb-5">
                <label class="text-xs text-gray-400 font-bold block mb-2"><i class="fas fa-brain"></i> เลือกโมเดล AI 後台:</label>
                <select id="aiModelSelector" onchange="updateSystemStatus()" class="w-full bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-lime-400 font-bold focus:outline-none">
                    <option value="gpt4o">🧠 GPT-4o Uncensored</option>
                    <option value="claude35">⚡ Claude 3.5 Sonnet</option>
                    <option value="deepseek">🕵️ DeepSeek-V3 Pro</option>
                    <option value="gemini">🌐 Gemini 1.5 Pro</option>
                    <option value="klaCustom">🔥 KLA Custom Core</option>
                </select>
            </div>

            <!-- ส่วนเลือกโหมดและการสวมบทบาทด่าประจำภาค -->
            <div class="mb-5 space-y-2">
                <label class="text-xs text-gray-400 font-bold block"><i class="fas fa-theater-masks"></i> โหมดการทำหน้าที่บอต:</label>
                <select id="chatMode" class="w-full bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-amber-400 font-bold focus:outline-none">
                    <option value="toxic">🖕 โหมดกวนตีน/คำหยาบทุกภาค</option>
                    <option value="nsfw">🔞 โหมดลามก 18+ (Uncensored)</option>
                    <option value="polite">😇 โหมดสุภาพช่วยเหลือการงาน</option>
                </select>
            </div>

            <!-- ปุ่มทางเลือกใช้งานเครื่องมือต่างๆ (ฟังก์ชันสคริปต์เกม, ลบลายน้ำ อยู่ครบถ้วน) -->
            <div class="space-y-2">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">ฟังก์ชันพิเศษ</p>
                <button onclick="triggerTool('สร้างสคริปต์เกม Roblox/Unity')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-gamepad text-indigo-400"></i> 🎮 สคริปต์เกมอัตโนมัติ
                </button>
                <button onclick="triggerTool('โมเดลโปร/สูตรโกงMod')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-bolt text-red-400"></i> ⚡ เจนโปร/สูตรโกงเกม
                </button>
                <button onclick="triggerTool('สร้างเว็บ HTML5/React')" class="w-full bg-gray-800 hover:bg-gray-700 text-left text-xs p-2.5 rounded-lg flex items-center gap-2 text-gray-200">
                    <i class="fas fa-code text-teal-400"></i> 🌐 สร้างหน้าเว็บอัตโนมัติ
                </button>
            </div>
        </div>

        <div class="text-[10px] text-gray-600 text-center border-t border-gray-800 pt-3 flex justify-between">
            <span>● Database Sync</span>
            <span class="text-lime-500">Auto-Saved</span>
        </div>
    </aside>

    <!-- ฉากหลังโปร่งแสงเมื่อเปิดเมนูควบคุม -->
    <div id="menuBackdrop" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 hidden z-45"></div>


    <!-- 1. HEADER TOP BAR (แถบเมนูด้านบนตามภาพเป๊ะๆ) -->
    <header class="w-full p-4 flex items-center justify-between z-10">
        <!-- ปุ่มเปิดเมนูแฮมเบอร์เกอร์ ☰ -->
        <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center text-gray-700 hover:bg-gray-100 rounded-full transition text-xl">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- ตัวเลือกส่วนหัวเว็บ Flash-Lite Extension -->
        <div class="flex items-center gap-1 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-full transition">
            <span class="text-md font-medium text-gray-700">Flash-Lite Exten...</span>
            <i class="fas fa-chevron-down text-xs text-gray-500 mt-0.5"></i>
        </div>

        <!-- ฝั่งขวา ไอคอนปากกาพู่กัน และรูปโปรไฟล์โปร่งใสตามภาพ -->
        <div class="flex items-center gap-4">
            <button onclick="resetDisplayChat()" class="text-gray-700 hover:text-black transition text-lg" title="เปิดหน้าใหม่">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
            <!-- รูปโปรไฟล์ Google Account จำลองสีฟ้าแบบในภาพของคุณ -->
            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white overflow-hidden shadow-inner cursor-pointer" onclick="toggleMenu()">
                <i class="fas fa-user text-sm mt-1"></i>
            </div>
        </div>
    </header>


    <!-- 2. CORE DISPLAY AREA (ส่วนกลางหน้าจอตามรูปภาพของคุณเป๊ะๆ) -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-12" id="mainDisplayView">
        
        <!-- กล่องระบบหน้าจอทักทายตอนเริ่มแบบ Gemini -->
        <div id="welcomeScreen" class="flex flex-col items-center text-center space-y-6">
            <!-- โลโก้ดาวประกายสีรุ้งทรงระบายตรงกลางภาพ -->
            <div class="w-14 h-14 sparkle-gradient animate-pulse shadow-sm"></div>
            
            <!-- ข้อความทักทายตามหน้าจอเป๊ะๆ -->
            <h2 class="text-3xl font-medium tracking-wide text-gray-800">ถามได้เลย คุณ กล้า</h2>
        </div>

        <!-- หน้าจอสำหรับพิมพ์แสดงผลประวัติคำตอบห้องแชท (จะเด้งขึ้นมาเมื่อพิมพ์คุย) -->
        <div id="activeChatLog" class="hidden w-full max-w-xl flex-col space-y-4 max-h-[50vh] overflow-y-auto p-2 text-sm">
            <!-- บล็อกแชทโต้ตอบจะมาเด้งขึ้นในหน้านี้ -->
        </div>
    </main>


    <!-- 3. FOOTER INPUT ROW (กล่องป้อนข้อมูลทรงแคปซูลมนสีขาวด้านล่างตามภาพของคุณเป๊ะๆ) -->
    <footer class="w-full p-4 max-w-xl mx-auto pb-8 z-10">
        <!-- ตัวแจ้งสถานะประมวลผลขนาดจิ๋ว -->
        <div id="statusIndicator" class="text-center text-[10px] text-gray-400 font-bold mb-2 tracking-wide uppercase">
            Engine Connected: GPT-4O (Uncensored Back-end)
        </div>

        <!-- กล่องแคปซูลอินพุตสีขาวมนทรง Capsule -->
        <div class="w-full bg-white rounded-full border border-gray-200/80 p-1.5 flex items-center justify-between shadow-sm focus-within:shadow-md transition">
            <!-- ปุ่มเพิ่มไฟล์เครื่องหมายบวก + ด้านซ้ายตามภาพ -->
            <label class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition cursor-pointer shrink-0">
                <i class="fas fa-plus text-lg"></i>
                <input type="file" class="hidden" onchange="handleFileUpload(this)">
            </label>

            <!-- ช่องอินพุตป้อนข้อความคำโปรยจางตามภาพ -->
            <input type="text" id="chatInputField" placeholder="ถาม Ge..." class="flex-1 px-2 py-2 text-md text-gray-800 focus:outline-none bg-transparent placeholder-gray-400/90 font-normal" onkeypress="if(event.key === 'Enter') handleInputSubmit()">

            <!-- กลุ่มไอคอนไมค์และขีดเสียงฝั่งขวาตามภาพเป๊ะๆ -->
            <div class="flex items-center gap-1 pr-1 shrink-0">
                <button onclick="triggerVoiceCall()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition text-lg" title="ข้อความเสียง">
                    <i class="fas fa-microphone"></i>
                </button>
                <button onclick="handleInputSubmit()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition text-md" title="ส่งข้อมูล">
                    <i class="fas fa-bars-staggered transform rotate-90"></i>
                </button>
            </div>
        </div>
    </footer>


    <!-- ระบบการทำงานทำงานเบื้องหลังซ่อนลิงก์การทำงาน (JavaScript Engine) -->
    <script>
        // เปิด-ปิดเมนูแถบควบคุมระบบความปลอดภัยหลังบ้าน
        function toggleMenu() {
            const sidebar = document.getElementById('controlSidebar');
            const backdrop = document.getElementById('menuBackdrop');

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
ใช้โค้ดอย่างระมัดระวัง
backdrop.classList.remove('hidden');
} else {
sidebar.classList.remove('translate-x-0');
sidebar.classList.add('-translate-x-full');
backdrop.classList.add('hidden');
}
}
// อัปเดตสถานะ Engine สมอง AI เมื่อสลับค่าตัวเลือก
function updateSystemStatus() {
const selector = document.getElementById('aiModelSelector');
const modelName = selector.options[selector.selectedIndex].text.split(' ')[1];
document.getElementById('statusIndicator').innerText = Engine Connected: ${modelName.toUpperCase()} (Uncensored Back-end);
}
// รีเซ็ตหน้าจอหลักให้กลับมาคลีนสวยงามเหมือนเปิดเครื่องใหม่
function resetDisplayChat() {
document.getElementById('welcomeScreen').classList.remove('hidden');
document.getElementById('activeChatLog').classList.add('hidden');
document.getElementById('activeChatLog').innerHTML = '';
}
// จัดการส่งข้อความโต้ตอบแชท
function handleInputSubmit() {
const input = document.getElementById('chatInputField');
if (!input.value.trim()) return;
const welcomeScreen = document.getElementById('welcomeScreen');
const chatLog = document.getElementById('activeChatLog');
// สลับโหมดหน้าจอทักทายเป็นกล่องแชทเมื่อพิมพ์
welcomeScreen.classList.add('hidden');
chatLog.classList.remove('hidden');
// ข้อความฝั่งผู้ใช้งานคุณกล้า
chatLog.innerHTML += <div class="flex flex-col items-end w-full"> <div class="bg-gray-100 border border-gray-200/60 p-3 rounded-2xl rounded-tr-none text-gray-800 max-w-[85%] font-normal"> ${input.value} </div> </div>;
// บัญชีคำสั่งสุ่มคำตอบสไตล์ KLA ปากจัดตามโมเดล
const currentInputValue = input.value;
setTimeout(() => {
chatLog.innerHTML += <div class="flex gap-3 w-full"> <div class="w-7 h-7 rounded-lg bg-blue-500 text-white flex items-center justify-center font-black text-[10px] shrink-0">AI</div> <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-2xl rounded-tl-none text-gray-800 max-w-[85%] leading-relaxed"> ระบบ Auto-Save ทำการบันทึกประวัติข้อความ "${currentInputValue}" เรียบร้อย! คราวนี้อินเตอร์เฟสเหมือนแอปมินิมอล Gemini ขาวคลีนสวยหรูตรงใจมึงยังไอ้เสือ! ฟังก์ชันหลังบ้านไม่พังแน่นอน! </div> </div>;
chatLog.scrollTop = chatLog.scrollHeight;
}, 350);
input.value = '';
setTimeout(() => { chatLog.scrollTop = chatLog.scrollHeight; }, 30);
}
function handleFileUpload(el) {
if (el.files.length > 0) alert(📁 [Auto-Saved] อัปโหลดไฟล์ "${el.files[0].name}" เข้าคลาวด์เรียบร้อย!);
}
function triggerVoiceCall() { alert("📞 ระบบจำลอง: เริ่มต้นการป้อนข้อมูลด้วยข้อความเสียงกับบอต..."); }
function triggerTool(name) { alert(⚙️ ระบบ KLA Dev Engine รันคำสั่ง "${name}" และเซฟซอร์สโค้ดเรียบร้อย!); toggleMenu(); }
