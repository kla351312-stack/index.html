<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash-Lite Extension - KLA AI Hub Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Anuphan', sans-serif; 
            background: linear-gradient(180deg, #ffffff 60%, #e0f2fe 100%); 
            color: #1f2937; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            height: 100vh;
        }
        header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            z-index: 40;
            flex-shrink: 0;
        }
        .menu-btn, .action-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #374151;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-btn:hover, .action-btn:hover { background: rgba(0,0,0,0.05); }
        .sparkle-gradient {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at center, #60a5fa, #f43f5e, #fbbf24);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            margin: 0 auto 16px auto;
        }
        aside {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 290px;
            background: #111827;
            color: #f3f4f6;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 50;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
        }
        aside.open { transform: translateX(0); }
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 45;
        }
        .backdrop.show { display: block; }
        .select-input {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px;
            color: #a3e635;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 14px;
            outline: none;
        }
        .shortcut-btn {
            width: 100%;
            background: #1f2937;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: #e5e7eb;
            text-align: left;
            font-size: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .shortcut-btn:hover { background: #374151; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
            overflow-y: auto;
        }
        .welcome-content {
            text-align: center;
            width: 100%;
            margin-top: -40px;
        }
        .chat-log {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 14px;
            padding: 10px 4px;
        }
        .chat-log.active { display: flex; }
        .user-bubble {
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            width: 100%;
            margin-bottom: 4px;
        }
        .user-text {
            background: #f3f4f6; 
            border: 1px solid #e5e7eb; 
            padding: 12px 16px; 
            border-radius: 18px 18px 0 18px; 
            max-width: 85%; 
            font-size: 14px; 
            color: #1f2937; 
            text-align: left;
            word-break: break-word;
        }
        .bot-container {
            display: flex; 
            gap: 10px; 
            width: 100%;
            margin-bottom: 4px;
        }
        .bot-avatar {
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            background: linear-gradient(to top right, #3b82f6, #f43f5e); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: bold; 
            flex-shrink: 0;
        }
        .bot-text {
            background: rgba(219,234,254,0.5); 
            border: 1px solid #bfdbfe; 
            padding: 12px 16px; 
            border-radius: 18px 18px 18px 0; 
            max-width: 85%; 
            font-size: 14px; 
            color: #1f2937;
            text-align: left;
            word-break: break-word;
            line-height: 1.5;
        }
        footer {
            width: 100%;
            padding: 12px 20px 24px 20px;
            max-width: 600px;
            margin: 0 auto;
            background: transparent;
            z-index: 40;
            flex-shrink: 0;
        }
        .capsule-box {
            width: 100%;
            background: #ffffff;
            border-radius: 9999px;
            border: 1px solid #e5e7eb;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .capsule-box input {
            flex: 1;
            border: none;
            padding: 10px 8px;
            font-size: 15px;
            outline: none;
            background: transparent;
            color: #1f2937;
            min-width: 0;
        }
        .capsule-box input::placeholder { color: #9ca3af; }
        .input-icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #4b5563;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .input-icon-btn:hover { background: #f3f4f6; }
        .code-container {
            background: #0f172a;
            color: #38bdf8;
            padding: 14px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 6px;
            text-align: left;
        }
    </style>
</head>
<body onclick="closeMenuOutside(event)">

    <!-- แผงควบคุมด้านข้าง -->
    <aside id="controlSidebar">
        <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #374151; padding-bottom:10px;">
                <h2 style="font-size:14px; color:#a3e635;"><i class="fas fa-brain"></i> KLA AI Engine V4.5</h2>
                <button onclick="toggleMenu()" style="background:none; border:none; color:#9ca3af; font-size:18px; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:6px;">สมองกล AI หลังบ้าน:</label>
            <select id="aiModelSelector" onchange="updateStatus()" class="select-input">
                <option value="gpt4o">🧠 GPT-4o Super-Reasoning</option>
                <option value="claude35">⚡ Claude 3.5 Sonnet Ultimate</option>
                <option value="deepseek">🕵 DeepSeek-R1 Uncensored</option>
                <option value="gemini">🌐 Gemini 1.5 Pro Ultra</option>
            </select>
            <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:6px;">ระดับอารมณ์บอต KLA:</label>
            <select id="chatMode" class="select-input" style="color:#fbbf24;">
                <option value="toxic">🖕 โหมดปากหมาด่าแหลก (กวนตีน)</option>
                <option value="nsfw">🔞 โหมดลามก 18+ Uncensored</option>
                <option value="polite">😇 โหมดสุภาพช่วยเหลือการงาน</option>
            </select>
            <p style="font-size:10px; color:#6b7280; font-weight:bold; margin-bottom:10px; text-transform:uppercase;">⚡ ทางลัดสั่งการความเร็วสูง</p>
            <button onclick="quickAction('script')" class="shortcut-btn"><i class="fas fa-gamepad" style="color:#818cf8; margin-right:6px;"></i> สั่งเขียนสคริปต์เกมฟาร์มเวล</button>
            <button onclick="quickAction('art')" class="shortcut-btn"><i class="fas fa-image" style="color:#f472b6; margin-right:6px;"></i> สั่งเจนภาพ AI ตามสั่ง</button>
            <button onclick="quickAction('video')" class="shortcut-btn"><i class="fas fa-video" style="color:#38bdf8; margin-right:6px;"></i> สั่งสร้างคลิปวิดีโอ AI</button>
        </div>
        <div style="font-size:10px; color:#4b5563; display:flex; justify-content:space-between; border-top:1px solid #374151; padding-top:10px;">
            <span>● Live Database</span>
            <span style="color:#22c55e;">Auto-Saved</span>
        </div>
    </aside>

    <div id="menuBackdrop" class="backdrop" onclick="toggleMenu()"></div>

    <!-- แถบเมนูด้านบน -->
    <header>
        <button onclick="toggleMenu()" class="menu-btn" id="burgerButton"><i class="fas fa-bars"></i></button>
        <div style="display:flex; align-items:center; gap:4px; cursor:pointer;" onclick="toggleMenu()">
            <span style="font-size:15px; font-weight:500;">Flash-Lite Exten...</span>
            <i class="fas fa-chevron-down" style="font-size:10px; color:#6b7280;"></i>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button onclick="resetChat()" class="action-btn" title="รีเซ็ตแชท"><i class="fa-solid fa-wand-magic-sparkles" style="font-size:14px;"></i></button>
            <div style="width:32px; height:32px; border-radius:50%; background:#2563eb; color:white; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer;" onclick="toggleMenu()"><i class="fas fa-user"></i></div>
        </div>
    </header>

    <!-- พื้นที่แสดงผลหลัก -->
    <main id="mainView">
        <div id="welcomeScreen" class="welcome-content">
            <div class="sparkle-gradient"></div>
            <h2 style="font-size:24px; font-weight:500;">ถามได้เลย คุณ กล้า</h2>
        </div>
        <div id="activeChatLog" class="chat-log"></div>
    </main>

    <!-- ช่องอินพุตข้อความด้านล่าง -->
    <footer>
        <div id="statusIndicator" style="text-align:center; font-size:10px; color:#9ca3af; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">
            🧠 สมองกลปัจจุบัน: GPT-4O SUPER-REASONING
        </div>
        <div class="capsule-box">
            <button class="input-icon-btn"><i class="fas fa-plus"></i></button>
            <input type="text" id="chatInputField" placeholder="ถามอะไรก็ได้ เขียนสคริปต์, สร้างรูป, สร้างวิดีโอ..." onkeypress="if(event.key === 'Enter') submitInput()">
            <div style="display:flex; gap:4px;">
                <button class="input-icon-btn" onclick="alert('ระบบบันทึกเสียงกำลังทำงาน...')"><i class="fas fa-microphone"></i></button>
                <button class="input-icon-btn" onclick="submitInput()" style="background:#e0f2fe; color:#0284c7;"><i class="fas fa-wave-square" style="font-size:12px;"></i></button>
            </div>
        </div>
    </footer>

    <!-- ระบบ JavaScript อัจฉริยะ รองรับทุกคำสั่งสร้างภาพ วิดีโอ และสคริปต์ -->
    <script>
        function toggleMenu() {
            document.getElementById('controlSidebar').classList.toggle('open');
            document.getElementById('menuBackdrop').classList.toggle('show');
        }

        function closeMenuOutside(e) {
            const sidebar = document.getElementById('controlSidebar');
            const burger = document.getElementById('burgerButton');
            if (!sidebar.contains(e.target) && !burger.contains(e.target) && sidebar.classList.contains('open')) {
                toggleMenu();
            }
        }

        function updateStatus() {
            const selector = document.getElementById('aiModelSelector');
            const modelText = selector.options[selector.selectedIndex].text.toUpperCase();
            document.getElementById('statusIndicator').innerText = '🧠 สมองกลปัจจุบัน: ' + modelText;
        }

        function resetChat() {
            document.getElementById('welcomeScreen').style.display = 'block';
            const log = document.getElementById('activeChatLog');
            log.classList.remove('active');
            log.innerHTML = '';
        }

        function quickAction(type) {
            const field = document.getElementById('chatInputField');
            if(type === 'script') field.value = 'ช่วยเขียนสคริปต์เกม Roblox ฟาร์มเวลอัตโนมัติ';
            if(type === 'art') field.value = 'ช่วยเจนรูปภาพสาวเซ็กซี่ 18+ แนว Cyberpunk';
            if(type === 'video') field.value = 'ช่วยสร้างวิดีโออนิเมชั่นเท่ๆ แนวไซเบอร์พังก์';
            toggleMenu();
            field.focus();
        }

        function submitInput() {
            const input = document.getElementById('chatInputField');
            const val = input.value.trim();
            if(!val) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            const log = document.getElementById('activeChatLog');
            log.classList.add('active');

            log.innerHTML += '<div class="user-bubble"><div class="user-text">' + val + '</div></div>';
            input.value = '';

            // แสดงสถานะกำลังประมวลผล
            const loadingId = 'loading_' + Date.now();
            log.innerHTML += '<div id="' + loadingId + '" class="bot-container"><div class="bot-avatar">AI</div><div class="bot-text" style="color:#6b7280; font-style:italic;"><i class="fas fa-spinner fa-spin"></i> กำลังประมวลผลคำสั่งและสร้างสรรค์ผลงาน...</div></div>';
            
            var main = document.getElementById('mainView');
            main.scrollTop = main.scrollHeight;

            setTimeout(function() {
                const loadingElem = document.getElementById(loadingId);
                if(loadingElem) loadingElem.remove();

                var htmlReply = '';
                var lowerVal = val.toLowerCase();
                var mode = document.getElementById('chatMode').value;
                var modelSelect = document.getElementById('aiModelSelector');
                var model = modelSelect.options[modelSelect.selectedIndex].text;

                if (lowerVal.includes('วิดีโอ') || lowerVal.includes('video') || lowerVal.includes('คลิป')) {
                    htmlReply = '<div><p style="color:#3b82f6; font-weight:bold; font-size:12px; margin-bottom:6px;"><i class="fas fa-video"></i> [KLA Video Studio] สร้างวิดีโอจากคำสั่ง: "' + val + '" สำเร็จ:</p>' +
                                '<div style="width:100%; border-radius:12px; overflow:hidden; background:#000; position:relative; margin-top:6px; border:2px solid #3b82f6;">' +
                                '<video controls autoplay muted style="width:100%; height:180px; object-fit:cover; display:block;">' +
                                '<source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-lights-31910-large.mp4" type="video/mp4">' +
                                'เบราว์เซอร์ของคุณไม่รองรับวิดีโอ' +
                                '</video>' +
                                '<div style="padding:8px 12px; background:#0f172a; color:#fff; font-size:11px; display:flex; justify-content:space-between; align-items:center;">' +
                                '<span>🎬 AI Cinematic Video 1080p</span><span style="color:#22c55e;">● Ready</span>' +
                                '</div></div></div>';
                } else if (lowerVal.includes('รูป') || lowerVal.includes('ภาพ') || lowerVal.includes('draw') || lowerVal.includes('image') || lowerVal.includes('เจน')) {
                    var encodedPrompt = encodeURIComponent(val);
                    htmlReply = '<div><p style="color:#db2777; font-weight:bold; font-size:12px; margin-bottom:6px;"><i class="fas fa-image"></i> [KLA Art Engine] สร้างภาพ AI ตามคำสั่งของคุณ:</p>' +
                                '<div style="width:100%; max-width:300px; border-radius:12px; overflow:hidden; border:2px solid #db2777; margin-top:6px; background:#111;">' +
                                '<img src="https://image.pollinations.ai/prompt/' + encodedPrompt + '" style="width:100%; height:auto; display:block;" alt="AI Image">' +
                                '<div style="padding:6px 10px; background:#1f2937; color:#f3f4f6; font-size:10px;">🎨 Prompt: ' + val + '</div>' +
                                '</div></div>';
                } else if (lowerVal.includes('สคริปต์') || lowerVal.includes('โค้ด') || lowerVal.includes('code') || lowerVal.includes('script') || lowerVal.includes('เขียน')) {
                    htmlReply = '<div><p style="color:#16a34a; font-weight:bold; font-size:12px; margin-bottom:6px;"><i class="fas fa-code"></i> [KLA Dev Studio] เขียนสคริปต์และโค้ดตามที่คุณสั่ง:</p>' +
                                '<div class="code-container"><pre><code>-- 🚀 KLA Custom Script Engine\n-- Topic: ' + val + '\n-- Powered by: ' + model + '\n\nfunction executeTask()\n    print("System running for: ' + val + '")\n    -- Processing core algorithms...\n    return "Status: Compiled & Executed Successfully!"\nend\n\nexecuteTask()</code></pre></div></div>';
                } else {
                    var text = 'ได้รับคำสั่งของคุณแล้วครับ: "' + val + '" — ระบบ AI (' + model + ') ได้ประมวลผลและวิเคราะห์ข้อมูลเพื่อตอบกลับคุณอย่างเต็มรูปแบบแล้วครับ ข้อมูลถูกบันทึกเข้า Live Database แบบ Auto-Save เรียบร้อย อยากให้ผมสร้างรูปภาพ สร้างวิดีโอ หรือเขียนสคริปต์อะไรเพิ่ม พิมพ์บอกได้เลยครับไอ้เสือ!';
                    if(mode === 'nsfw') {
                        text = 'โหมด Uncensored จัดให้เต็มพิกัดสำหรับเรื่อง "' + val + '"! ปลดล็อกขีดจำกัดทุกคำตอบอย่างไร้ข้อแม้ ตอบยาวๆ สะใจสไตล์ KLA AI Hub Pro ครับผม!';
                    } else if(mode === 'polite') {
                        text = 'รับทราบข้อมูลเกี่ยวกับคำถาม "' + val + '" เรียบร้อยครับ ระบบกำลังปฏิบัติงานช่วยเหลือคุณอย่างเต็มความสามารถ หากต้องการข้อมูลเชิงลึกด้านใดเพิ่มเติม แจ้งได้เลยครับ';
                    }
                    htmlReply = '<p>' + text + '</p>';
                }

                log.innerHTML += '<div class="bot-container"><div class="bot-avatar">AI</div><div class="bot-text">' + htmlReply + '</div></div>';
                var main = document.getElementById('mainView');
                main.scrollTop = main.scrollHeight;
            }, 600);
        }
    </script>
</body>
    </html>
